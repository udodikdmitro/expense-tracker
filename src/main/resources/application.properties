spring.application.name=expense-tracker

# --- Database connection (PostgreSQL from docker-compose, host port 5433) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/expenses
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- JPA / Hibernate ---
# update: Hibernate creates/alters tables from @Entity classes (fine for learning, use Flyway in real projects)
spring.jpa.hibernate.ddl-auto=update
# Print generated SQL to the console so we can see what Hibernate does
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Don't keep the DB session open while rendering the HTTP response
spring.jpa.open-in-view=false
