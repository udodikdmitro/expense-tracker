services:
  postgres:
    image: postgres:16
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 on the host is already in use)
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
